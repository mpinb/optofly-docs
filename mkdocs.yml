site_name: "OptoFly Ecosystem Wiki"
site_url: "https://mpinb.github.io/optofly-docs/"
repo_url: "https://github.com/mpinb/optofly-docs"

exclude_docs: |
  superpowers/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default

markdown_extensions:
  - admonition          # enables !!! note / !!! warning callout boxes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Overview: overview.md
  - Setup:
      - Environment: setup/environment.md
      - udev Rules: setup/udev-rules.md
      - Basler ChArUco Calibrator: setup/basler-charuco-calibrator-setup.md
      - Braid Extrinsic Calibration: setup/braid-extrinsic-calibration.md
      - Liquid Lens Calibration: setup/liquid-lens-calibration-setup.md
      - OptoFly: setup/optofly-setup.md
      - Optotune Lens: setup/optotune-lens-setup.md
      - Ximea Py: setup/ximea-py-setup.md
  - Workflow: workflow.md
  - Troubleshooting: troubleshooting.md
  - Using Claude Code: claude-code.md
  - Component Docs:
      - OptoFly:
          - Overview: repos/optofly/index.md
          - Getting Started: repos/optofly/getting-started.md
          - Calibration: repos/optofly/calibration.md
          - Architecture: repos/optofly/architecture.md
          - Camera: repos/optofly/camera.md
          - Opto Trigger: repos/optofly/opto-trigger.md
          - Visual Stimuli (Panda3D): repos/optofly/visual-stimuli-panda3d.md
          - Troubleshooting: repos/optofly/troubleshooting.md
      - Liquid Lens Calibration: repos/liquid-lens-calibration/README.md
      - Basler ChArUco Calibrator: repos/basler-charuco-calibrator/README.md
      - Optotune Lens: repos/optotune-lens/README.md
      - Ximea Py: repos/ximea-py/README.md
